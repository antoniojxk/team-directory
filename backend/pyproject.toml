[project]
name = "team-directory"
version = "1.0.0"
description = "A small, permission-aware people directory"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mypy>=1.19,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
  "$MYPY_CONFIG_FILE_DIR/app",
  "$MYPY_CONFIG_FILE_DIR/tests",
  "$MYPY_CONFIG_FILE_DIR/alembic",
  "$MYPY_CONFIG_FILE_DIR/../scripts",
]
mypy_path = "$MYPY_CONFIG_FILE_DIR"
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
