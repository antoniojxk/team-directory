name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: team
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: team_directory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U team -d team_directory_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://team:test-only-password@127.0.0.1:5432/team_directory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --frozen
      - run: backend/.venv/bin/mypy --config-file backend/pyproject.toml
      - run: backend/.venv/bin/ruff check backend scripts
      - run: backend/.venv/bin/ruff format --check backend scripts
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run build
        working-directory: frontend
      - run: backend/.venv/bin/pytest backend/tests -q
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker build -t team-directory:ci .
