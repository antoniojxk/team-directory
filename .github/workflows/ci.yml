name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: team
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: team_directory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U team -d team_directory_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://team:test-only-password@127.0.0.1:5432/team_directory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --frozen
      - run: backend/.venv/bin/mypy --config-file backend/pyproject.toml
      - run: backend/.venv/bin/ruff check backend scripts
      - run: backend/.venv/bin/ruff format --check backend scripts
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run build
        working-directory: frontend
      - run: backend/.venv/bin/pytest backend/tests -q
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker build -t team-directory:ci .

  deploy-production:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: team-directory-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_HOSTING_SITE_ID: ${{ vars.FIREBASE_HOSTING_SITE_ID }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      GCP_BACKEND_PROJECT_ID: ${{ vars.GCP_BACKEND_PROJECT_ID }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      BACKEND_IMAGE: ${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ vars.GCP_BACKEND_PROJECT_ID }}/team-directory/app:${{ github.sha }}
      FIREBASE_CLI_VERSION: ${{ vars.FIREBASE_CLI_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate deployment settings
        shell: bash
        run: |
          for name in FIREBASE_PROJECT_ID FIREBASE_HOSTING_SITE_ID VITE_API_BASE_URL FIREBASE_CLI_VERSION GCP_BACKEND_PROJECT_ID CLOUD_RUN_REGION; do
            test -n "${!name}" || { echo "Missing deployment variable: $name"; exit 1; }
          done
          node scripts/prepare-hosting.mjs
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm install --global "firebase-tools@$FIREBASE_CLI_VERSION"
      - name: Reject superseded production commits
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push backend image
        run: |
          gcloud auth configure-docker "$CLOUD_RUN_REGION-docker.pkg.dev" --quiet
          docker build -t "$BACKEND_IMAGE" .
          docker push "$BACKEND_IMAGE"
      - name: Migrate and deploy backend
        run: bash scripts/deploy-backend.sh
      - name: Deploy production
        if: github.event_name == 'push'
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
