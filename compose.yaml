services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: team_directory
      POSTGRES_USER: team
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team -d team_directory"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://team:${POSTGRES_PASSWORD}@db:5432/team_directory
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:?Set DEMO_VIEWER_PASSWORD in .env}
      DEMO_HR_PASSWORD: ${DEMO_HR_PASSWORD:?Set DEMO_HR_PASSWORD in .env}
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: team_directory_test
      POSTGRES_USER: team
      POSTGRES_PASSWORD: test-only-password
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team -d team_directory_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
